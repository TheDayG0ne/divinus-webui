<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="OpenIPC x86 camera dashboard">
  <title>OpenIPC x86 · Dashboard</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/a/bootstrap.min.css">
  <link rel="stylesheet" href="/a/bootstrap.override.css">
  <link rel="stylesheet" href="/a/divinus.css">
  <script src="/a/divinus.js" defer></script>
</head>
<body>
<header class="navbar navbar-dark bg-dark border-bottom"><div class="container">
  <a class="navbar-brand" href="/"><img alt="OpenIPC" height="32" src="/a/logo.svg"><span class="x-small ms-1">x86</span></a>
  <span class="text-secondary small">Dashboard</span>
</div></header>
<main class="container py-4">
  <div class="d-flex align-items-center justify-content-between gap-3 flex-wrap">
    <div><h1 class="h3 mb-1">Cameras</h1><p class="text-secondary mb-0" id="status-message" role="status">Loading camera registry…</p></div>
    <button type="button" class="btn btn-outline-secondary btn-sm" id="refresh">Refresh</button>
  </div>
  <div id="camera-grid" class="row g-3 mt-1" aria-live="polite"></div>
  <p id="empty-message" class="text-secondary mt-4" hidden>No configured camera slots.</p>
  <div id="warning" class="alert alert-warning mt-4" role="note">Dynamic camera management, per-slot snapshot and per-slot live status are not implemented yet. A registry entry is a configured slot; <code>status: unknown</code> is not availability.</div>
  <section id="system-detail" class="mt-4" hidden>
    <div class="card"><div class="card-body"><h2 class="h5">System status</h2><p id="system-message" role="status"></p><dl id="status" class="divinus-status"></dl></div></div>
  </section>
</main>
</body>
</html>
