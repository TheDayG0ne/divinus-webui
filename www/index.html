<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="OpenIPC x86 camera dashboard">
  <title>OpenIPC x86 · Dashboard</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/a/bootstrap.min.css">
  <link rel="stylesheet" href="/a/bootstrap.override.css">
  <link rel="stylesheet" href="/a/divinus.css">
  <script src="/a/divinus.js" defer></script>
</head>
<body>
<header class="navbar navbar-dark bg-dark border-bottom">
  <div class="container">
    <a class="navbar-brand" href="/"><img alt="OpenIPC" height="32" src="/a/logo.svg"><span class="x-small ms-1">x86</span></a>
    <span class="text-secondary small">Dashboard</span>
  </div>
</header>
<main class="container py-4">
  <div class="d-flex align-items-center justify-content-between gap-3 flex-wrap">
    <div><h1 class="h3 mb-1">Cameras</h1><p class="text-secondary mb-0" id="status-message" role="status">Discovering cameras…</p></div>
    <button type="button" class="btn btn-outline-secondary btn-sm" id="refresh">Refresh</button>
  </div>
  <div id="camera-grid" class="row g-3 mt-1" aria-live="polite"></div>
  <p id="empty-message" class="text-secondary mt-4" hidden>No cameras are currently available.</p>

  <!-- Reserved until the backend defines OpenWall capabilities and availability. -->
  <section id="openwall-card" hidden></section>
  <section id="camera-detail" class="mt-4" hidden aria-labelledby="camera-title">
    <div class="d-flex justify-content-between align-items-center mb-2"><h2 class="h5 mb-0" id="camera-title">Camera</h2><span class="badge text-bg-success" id="camera-state">Available</span></div>
    <div class="row g-3">
      <section class="col-lg-8"><div class="card"><div class="card-body">
        <div class="mj-live-head"><h3 class="h5" id="preview-title">Preview</h3></div>
        <div class="divinus-preview"><img id="preview" alt="Live camera preview" hidden><p id="preview-note">Checking stream availability…</p></div>
        <div class="d-flex gap-2 mt-3 flex-wrap"><button class="btn btn-outline-primary btn-sm" id="preview-toggle" type="button" disabled>Stop preview</button><a class="btn btn-outline-secondary btn-sm" id="snapshot" href="/image.jpg" target="_blank" rel="noopener" hidden>Open snapshot</a></div>
      </div></div></section>
      <section class="col-lg-4">
        <div class="card"><div class="card-body"><h3 class="h5">System status</h3><dl id="status" class="divinus-status"></dl></div></div>
        <div class="card mt-3" id="settings-card" hidden><div class="card-body"><h3 class="h5">Image settings</h3><p class="small text-secondary">Settings are shown only for an available camera.</p><form id="isp-form">
          <div class="form-check form-switch mb-2"><input class="form-check-input" id="mirror" type="checkbox"><label class="form-check-label" for="mirror">Mirror</label></div>
          <div class="form-check form-switch mb-2"><input class="form-check-input" id="flip" type="checkbox"><label class="form-check-label" for="flip">Flip</label></div>
          <label for="antiflicker" class="form-label">Antiflicker (Hz; -1 off)</label><input class="form-control mb-3" id="antiflicker" type="number" min="-1" max="60" required>
          <div class="d-flex gap-2 flex-wrap"><button class="btn btn-primary btn-sm" id="apply">Apply</button><button class="btn btn-outline-secondary btn-sm" id="save" type="button">Save configuration</button></div>
        </form><p class="small mt-3 mb-0" id="isp-message" role="status"></p>
        <hr><h3 class="h6">Audio</h3><form id="audio-form">
          <div class="form-check form-switch mb-2"><input class="form-check-input" id="audio-enable" type="checkbox"><label class="form-check-label" for="audio-enable">Enable audio</label></div>
          <label class="form-label" for="audio-bitrate">Bitrate (kbps)</label><input class="form-control mb-2" id="audio-bitrate" type="number">
          <label class="form-label" for="audio-gain">Gain</label><input class="form-control mb-2" id="audio-gain" type="number">
          <label class="form-label" for="audio-srate">Sample rate (Hz)</label><input class="form-control mb-3" id="audio-srate" type="number">
          <button class="btn btn-primary btn-sm" id="audio-apply">Apply audio</button>
        </form><p class="small mt-3 mb-0" id="audio-message" role="status"></p></div></div>
      </section>
    </div>
  </section>
</main>
</body>
</html>
