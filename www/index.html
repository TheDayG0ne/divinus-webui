<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="OpenIPC x86 camera dashboard">
  <title>OpenIPC x86 · Dashboard</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/a/bootstrap.min.css">
  <link rel="stylesheet" href="/a/bootstrap.override.css">
  <link rel="stylesheet" href="/a/divinus.css">
  <script src="/a/divinus.js" defer></script>
</head>
<body>
<header class="navbar navbar-dark bg-dark border-bottom"><div class="container">
  <a class="navbar-brand" href="/"><img alt="OpenIPC" height="32" src="/a/logo.svg"><span class="x-small ms-1">x86</span></a>
  <span class="text-secondary small">Dashboard</span>
</div></header>
<main class="container py-4">
  <div class="d-flex align-items-center justify-content-between gap-3 flex-wrap">
    <div><h1 class="h3 mb-1">Camera pipeline</h1><p class="text-secondary mb-0" id="status-message" role="status">Loading camera registry…</p></div>
    <button type="button" class="btn btn-outline-secondary btn-sm" id="refresh">Refresh</button>
  </div>
  <div id="camera-grid" class="row g-3 mt-1" aria-live="polite"></div>
  <p id="empty-message" class="text-secondary mt-4" hidden>No camera pipeline registered.</p>
  <section id="camera-detail" class="mt-4" hidden>
    <div class="d-flex justify-content-between align-items-center mb-2"><h2 class="h5 mb-0">Local pipeline</h2><span class="badge text-bg-secondary" id="camera-state">Status unknown</span></div>
    <div class="card"><div class="card-body">
      <p id="capabilities"></p>
      <p class="small text-secondary">A configured snapshot may still fail until an MJPEG frame is captured. Continuous MJPEG and audio are not supported by the x86 UVC backend.</p>
      <a class="btn btn-outline-secondary btn-sm" id="snapshot" href="/image.jpg" target="_blank" rel="noopener" hidden>Open snapshot</a>
    </div></div>
    <div class="card mt-3"><div class="card-body"><h3 class="h5">System status</h3><p id="system-message" role="status"></p><dl id="status" class="divinus-status"></dl></div></div>
  </section>
</main>
</body>
</html>
